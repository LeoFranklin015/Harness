<text x="716" y="811" fill="#eef2f8" fill-opacity="0.9" font-size="12.5" font-weight="500" text-anchor="middle">GitHub</text>
<rect x="950" y="44" width="402" height="850" rx="16" fill="none" stroke="#5fb3e0" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="7 6"/>
<text x="974" y="75" fill="#5fb3e0" font-size="13" font-weight="600" letter-spacing="1.7">ON CHAIN · ENSv2 AND OUR REGISTRIES</text>
<text x="974" y="95" fill="#5fb3e0" fill-opacity="0.58" font-size="11.5">Read at request time. Nothing here is a copy of anything.</text>
<rect x="974" y="128" width="354" height="264" rx="16" fill="none" stroke="#5fb3e0" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="998" y="159" fill="#5fb3e0" font-size="13" font-weight="600" letter-spacing="1.7">harness.eth · PLATFORMREGISTRY</text>
<rect x="998" y="178" width="306" height="190" rx="16" fill="none" stroke="#5fb3e0" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 5"/>
<text x="1022" y="209" fill="#5fb3e0" font-size="13" font-weight="600" letter-spacing="1.7">alex.harness.eth · MACHINE REGISTRY</text>
<rect x="1022" y="228" width="258" height="116" rx="12" fill="#0b2130" stroke="#5fb3e0" stroke-opacity="0.7" stroke-width="1.3"/>
<text x="1151" y="283" fill="#eef2f8" font-size="14.5" font-weight="600" text-anchor="middle">runner.alex.harness.eth</text>
<text x="1151" y="303" fill="#5fb3e0" fill-opacity="0.78" font-size="12" text-anchor="middle">agentKey · window · revoked</text>
<rect x="974" y="470" width="354" height="92" rx="12" fill="#0b2130" stroke="#5fb3e0" stroke-opacity="0.7" stroke-width="1.3"/>
<text x="1151" y="513" fill="#eef2f8" font-size="15.5" font-weight="600" text-anchor="middle">AgentResolver</text>
<text x="1151" y="533" fill="#5fb3e0" fill-opacity="0.78" font-size="12" text-anchor="middle">ENSIP-10 · computed at read time</text>
<rect x="974" y="620" width="354" height="92" rx="12" fill="#0b2130" stroke="#5fb3e0" stroke-opacity="0.7" stroke-width="1.3"/>
<text x="1151" y="663" fill="#eef2f8" font-size="15.5" font-weight="600" text-anchor="middle">AllowanceExecutor</text>
<text x="1151" y="683" fill="#5fb3e0" fill-opacity="0.78" font-size="12" text-anchor="middle">runs the call, holds nothing after</text>
<path d="M 1151 470 L 1151 394" fill="none" stroke="#5fb3e0" stroke-opacity="0.9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#m5fb3e0)"/>
<text x="1139" y="436" fill="#5fb3e0" fill-opacity="0.92" font-size="12" text-anchor="end">walks down, reads these rows</text>
<text x="974" y="776" fill="#5fb3e0" fill-opacity="0.58" font-size="11.8" text-anchor="start">None of these rows exist for ENS. They are what</text>
<text x="974" y="796" fill="#5fb3e0" fill-opacity="0.58" font-size="11.8" text-anchor="start">the door and the spend path already read; the</text>
<text x="974" y="816" fill="#5fb3e0" fill-opacity="0.58" font-size="11.8" text-anchor="start">resolver is a second reader of them.</text>
<path d="M 184 118 L 184 24 L 1376 24 L 1376 116 L 1354 116" fill="none" stroke="#e8a33d" stroke-opacity="0.9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#me8a33d)"/>
<text x="198" y="18" fill="#e8a33d" fill-opacity="0.92" font-size="12" text-anchor="start">the same two taps mint the name and set the ceiling</text>
<path d="M 704 208 L 704 266 L 24 266 L 24 795 L 70 795" fill="none" stroke="#e8a33d" stroke-opacity="0.9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#me8a33d)"/>
<text x="690" y="260" fill="#e8a33d" fill-opacity="0.92" font-size="12" text-anchor="end">4  sealed under the ring, written to the machine</text>
<path d="M 432 386 L 454 386" fill="none" stroke="#4fd1c0" stroke-opacity="0.9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#m4fd1c0)"/>
<text x="444" y="334" fill="#4fd1c0" fill-opacity="0.92" font-size="12" text-anchor="middle">1  where?</text>
<path d="M 816 386 L 910 386 L 910 498 L 972 498" fill="none" stroke="#4fd1c0" stroke-opacity="0.9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#m4fd1c0)"/>
<text x="898" y="456" fill="#4fd1c0" fill-opacity="0.92" font-size="12" text-anchor="end">2  resolve — an address, or nothing</text>
<path d="M 342 428 L 342 578" fill="none" stroke="#4fd1c0" stroke-opacity="0.9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#m4fd1c0)"/>
<text x="354" y="506" fill="#4fd1c0" fill-opacity="0.92" font-size="12" text-anchor="start">3  connects, offers a key</text>
<path d="M 816 612 L 910 612 L 910 534 L 972 534" fill="none" stroke="#9b8cf5" stroke-opacity="0.9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#m9b8cf5)"/>
<text x="898" y="700" fill="#9b8cf5" fill-opacity="0.92" font-size="12" text-anchor="start" transform="rotate(-90 898 700)">4  is this fingerprint admitted?</text>
<path d="M 816 688 L 870 688 L 870 666 L 972 666" fill="none" stroke="#9b8cf5" stroke-opacity="0.9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#m9b8cf5)"/>
<text x="858" y="700" fill="#9b8cf5" fill-opacity="0.92" font-size="12" text-anchor="start" transform="rotate(-90 858 700)">spends, against the ceiling</text>
<path d="M 950 764 L 842 764" fill="none" stroke="#e2615f" stroke-opacity="0.9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#me2615f)"/>
<text x="895" y="754" fill="#e2615f" fill-opacity="0.92" font-size="12" text-anchor="middle">revoke</text>
<text x="48" y="934" fill="#8d97a6" font-size="13">Two handshakes and one boundary. The ring is why a server can decrypt at 3am; the door is why a shell exists only while the chain still says so; the mesh is why neither is reachable without an invite.</text>
</svg>