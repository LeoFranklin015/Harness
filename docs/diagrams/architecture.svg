<rect width="1400" height="960" rx="20" fill="#08090a"/>
<rect x="48" y="44" width="792" height="202" rx="16" fill="none" stroke="#e8a33d" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="7 6"/>
<text x="72" y="75" fill="#e8a33d" font-size="13" font-weight="600" letter-spacing="1.7">SETTING UP THE RING · ONCE, AND THEN NEVER AGAIN</text>
<text x="72" y="95" fill="#e8a33d" fill-opacity="0.58" font-size="11.5">The key never leaves the device. The browser is a wire, not a participant.</text>
<rect x="72" y="118" width="224" height="90" rx="12" fill="#2a1d08" stroke="#e8a33d" stroke-opacity="0.7" stroke-width="1.3"/>
<text x="184" y="160" fill="#eef2f8" font-size="15.5" font-weight="600" text-anchor="middle">Ledger</text>
<text x="184" y="180" fill="#e8a33d" fill-opacity="0.78" font-size="12" text-anchor="middle">holds the seed, signs on a press</text>
<rect x="332" y="118" width="224" height="90" rx="12" fill="#2a1d08" stroke="#e8a33d" stroke-opacity="0.7" stroke-width="1.3"/>
<text x="444" y="160" fill="#eef2f8" font-size="15.5" font-weight="600" text-anchor="middle">Browser</text>
<text x="444" y="180" fill="#e8a33d" fill-opacity="0.78" font-size="12" text-anchor="middle">WebHID · reads none of it</text>
<rect x="592" y="118" width="224" height="90" rx="12" fill="#2a1d08" stroke="#e8a33d" stroke-opacity="0.7" stroke-width="1.3"/>
<text x="704" y="160" fill="#eef2f8" font-size="15.5" font-weight="600" text-anchor="middle">Broker</text>
<text x="704" y="180" fill="#e8a33d" fill-opacity="0.78" font-size="12" text-anchor="middle">speaks LKRP · stream 17</text>
<path d="M 296 163 L 330 163" fill="none" stroke="#e8a33d" stroke-opacity="0.9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#me8a33d)"/>
<text x="314" y="108" fill="#e8a33d" fill-opacity="0.92" font-size="12" text-anchor="middle">1  opens it over USB</text>
<path d="M 556 163 L 590 163" fill="none" stroke="#e8a33d" stroke-opacity="0.9" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#me8a33d)"/>
<text x="574" y="108" fill="#e8a33d" fill-opacity="0.92" font-size="12" text-anchor="middle">2  relays the protocol</text>
<text x="704" y="228" fill="#e8a33d" fill-opacity="0.85" font-size="12" text-anchor="middle">3  one press admits the broker as a member</text>
<rect x="48" y="282" width="792" height="612" rx="16" fill="none" stroke="#4fd1c0" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="7 6"/>
<text x="72" y="313" fill="#4fd1c0" font-size="13" font-weight="600" letter-spacing="1.7">TAILSCALE MESH</text>
<text x="72" y="333" fill="#4fd1c0" fill-opacity="0.58" font-size="11.5">No public address, no open port. Invites are single-use.</text>
<rect x="72" y="344" width="360" height="84" rx="12" fill="#07211f" stroke="#4fd1c0" stroke-opacity="0.7" stroke-width="1.3"/>
<text x="252" y="383" fill="#eef2f8" font-size="15.5" font-weight="600" text-anchor="middle">Your laptop</text>
<text x="252" y="403" fill="#4fd1c0" fill-opacity="0.78" font-size="12" text-anchor="middle">ssh runner.alex.harness.eth</text>
<rect x="456" y="344" width="360" height="84" rx="12" fill="#07211f" stroke="#4fd1c0" stroke-opacity="0.7" stroke-width="1.3"/>
<text x="636" y="383" fill="#eef2f8" font-size="15.5" font-weight="600" text-anchor="middle">Nameserver</text>
<text x="636" y="403" fill="#4fd1c0" fill-opacity="0.78" font-size="12" text-anchor="middle">answers .eth over DNS</text>
<rect x="72" y="466" width="744" height="404" rx="16" fill="none" stroke="#9b8cf5" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="7 6"/>
<text x="96" y="497" fill="#9b8cf5" font-size="13" font-weight="600" letter-spacing="1.7">THE HOST · ONE VM</text>
<rect x="96" y="528" width="338" height="318" rx="16" fill="none" stroke="#9b8cf5" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 5"/>
<text x="120" y="559" fill="#9b8cf5" font-size="13" font-weight="600" letter-spacing="1.7">ALEX.HARNESS.ETH</text>
<text x="120" y="579" fill="#9b8cf5" fill-opacity="0.58" font-size="11.5">own network, no shared filesystem</text>
